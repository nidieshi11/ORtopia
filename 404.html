<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页面未找到 · ORtopia</title>
  <script>
    // GitHub Pages serves this page for bookmarked files under the old directory.
    const url = new URL(location.href);
    const match = url.pathname.match(/^(.*\/)benchmark\/(papers\/.+\.pdf|assets\/P\d+\/(?:scene_zh\.webp|mathematical_model\.tex|page-\d+\.svg)|assets\/replays\/.+)$/i);
    if (match) {
      const area = match[2].startsWith('assets/replays/') ? 'simulation/' : 'dataset/';
      url.pathname = match[1] + area + match[2];
      location.replace(url.href);
    }
  </script>
</head>
<body>
  <h1>页面未找到</h1>
  <a href="https://nidieshi11.github.io/ORtopia/">返回 ORtopia 首页</a>
</body>
</html>
