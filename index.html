<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ee">
  <title>A Utopia for AI-Native Operations Research</title>
  <script>
    // Older links used the fragment to select a simulation or a catalog view.
    if (/^#(?:(?:\/problem\/)?P\d{4}(?:\/[1-9]\d*)?|scene\/.+|remaining|world20|lab20)$/.test(location.hash)) {
      location.replace('simulation/' + location.search + location.hash);
    } else if (/^#\/(?:domains|library|domain\/[^/]+(?:\/[^/]+)?|case\/P\d{4})$/.test(location.hash)) {
      location.replace('dataset/' + location.search + location.hash);
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      background: #f6f5ee;
      color: #163d34;
      font-family: "Inter", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 90% 10%, #e8eddf 0%, transparent 55%),
                  #f6f5ee;
    }
    main {
      display: grid;
      align-content: center;
      width: min(80%, 64rem);
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding-block: clamp(3rem, 10vh, 8rem);
    }
    h1 {
      margin: 0;
      text-align: center;
      font: 400 clamp(2rem, 1.45rem + 2.7vw, 4rem)/1.12 "Baskervville", Georgia, serif;
      letter-spacing: -.035em;
    }
    h1 em { font-weight: 400; white-space: nowrap; }
    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .5rem clamp(1.25rem, 4vw, 3rem);
      margin-top: clamp(1.5rem, 3.5vh, 2.5rem);
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-self: start;
      gap: 1.25rem;
      min-height: 44px;
      padding: .5rem 0;
      border-bottom: 1px solid currentColor;
      color: inherit;
      font-size: 1.125rem;
      font-weight: 600;
      text-decoration: none;
    }
    .language-switch {
      position: absolute;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .3rem;
      min-height: 44px;
      padding: 0 .65rem;
      border: 1px solid #bac7b7;
      border-radius: 2rem;
      background: #f6f5ee;
      color: inherit;
      font: 600 .8rem/1 "Inter", "Segoe UI", sans-serif;
      cursor: pointer;
    }
    .language-switch[hidden] { display: none; }
    .language-switch:hover { background: #e8eddf; }
    .language-switch:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    :root:lang(en) .copy-zh, :root:lang(zh) .copy-en { display: none; }
    :root:lang(en) .mark-en, :root:lang(zh) .mark-zh {
      text-decoration: underline;
      text-underline-offset: .22em;
    }
    h1 .copy-zh { font-family: "Songti SC", SimSun, serif; text-wrap: balance; }
    .arrow {
      position: relative;
      width: 1.5rem;
      height: 1px;
      background: currentColor;
      transition: transform .18s ease-out;
    }
    .arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: .49rem;
      height: .49rem;
      border-top: 1px solid currentColor;
      border-right: 1px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }
    a:hover .arrow, a:focus-visible .arrow { transform: translateX(.28rem); }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
    @media (max-width: 32rem) {
      main { width: auto; padding-inline: 1.5rem; }
      h1 { font-size: clamp(1.5rem, .2rem + 7vw, 2.25rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <button type="button" class="language-switch" id="language-switch"
          aria-label="Switch to Chinese (中文)" title="Switch to Chinese (中文)" hidden>
    <span class="mark-zh" lang="zh-CN" aria-hidden="true">中</span><span aria-hidden="true">/</span><span class="mark-en" lang="en" aria-hidden="true">EN</span>
  </button>
  <main>
    <h1><span class="copy-en" lang="en">A Utopia for <em>AI-Native</em><br> Operations Research</span><span class="copy-zh" lang="zh-CN">AI 原生运筹优化的理想国</span></h1>
    <nav aria-label="ORtopia">
      <a href="dataset/"><span><span class="copy-en" lang="en">Dataset</span><span class="copy-zh" lang="zh-CN">数据集</span></span><span class="arrow" aria-hidden="true"></span></a>
      <a href="simulation/"><span><span class="copy-en" lang="en">Simulation</span><span class="copy-zh" lang="zh-CN">仿真</span></span><span class="arrow" aria-hidden="true"></span></a>
    </nav>
  </main>
  <script>
    (() => {
      const button = document.getElementById('language-switch');
      const preference = 'ortopia.cover.language';
      function show(chinese) {
        document.documentElement.lang = chinese ? 'zh-CN' : 'en';
        document.title = chinese ? 'AI 原生运筹优化的理想国' : 'A Utopia for AI-Native Operations Research';
        button.title = chinese ? '切换到英文 (English)' : 'Switch to Chinese (中文)';
        button.setAttribute('aria-label', button.title);
      }
      let saved;
      try { saved = localStorage.getItem(preference); } catch {}
      show(saved === 'zh' || (saved !== 'en' && /^zh(?:-|$)/i.test(navigator.language)));
      button.hidden = false;
      button.addEventListener('click', () => {
        const chinese = document.documentElement.lang === 'en';
        show(chinese);
        try { localStorage.setItem(preference, chinese ? 'zh' : 'en'); } catch {}
      });
    })();
  </script>
</body>
</html>
