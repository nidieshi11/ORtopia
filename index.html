<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light"><meta name="theme-color" content="#f5f0e6">
  <title>A Utopia for AI-Native Operations Research</title>
  <script>
    // Older links used the fragment to select a simulation or a catalog view.
    if (/^#(?:(?:\/problem\/)?P\d{4}(?:\/[1-9]\d*)?|scene\/.+|remaining|world20|lab20)$/.test(location.hash)) {
      location.replace('simulation/' + location.search + location.hash);
    } else if (/^#\/(?:domains|library|domain\/[^/]+(?:\/[^/]+)?|case\/P\d{4})$/.test(location.hash)) {
      location.replace('dataset/' + location.search + location.hash);
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      background: #f6f5ee;
      color: #163d34;
      font-family: "Inter", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf9f4;
    }
    main {
      display: grid;
      align-content: center;
      width: min(80%, 64rem);
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding-block: clamp(1.25rem, 4vh, 3rem);
    }
    .cover {
      display: block;
      width: min(100%, 49rem, 77vh);
      height: auto;
      margin: 0 auto clamp(1rem, 3vh, 2rem);
      mix-blend-mode: multiply;
    }
    h1 {
      margin: 0;
      text-align: center;
      font: 400 clamp(2rem, 1.35rem + 2vw, 3.5rem)/1.12 "Baskervville", Georgia, serif;
      letter-spacing: -.035em;
    }
    h1 em { font-weight: 400; white-space: nowrap; }
    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .5rem clamp(1.25rem, 4vw, 3rem);
      margin-top: clamp(1rem, 2.5vh, 1.75rem);
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-self: start;
      gap: 1.25rem;
      min-height: 44px;
      padding: .5rem 0;
      border-bottom: 1px solid currentColor;
      color: inherit;
      font-size: 1.125rem;
      font-weight: 600;
      text-decoration: none;
    }
    .arrow {
      position: relative;
      width: 1.5rem;
      height: 1px;
      background: currentColor;
      transition: transform .18s ease-out;
    }
    .arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: .49rem;
      height: .49rem;
      border-top: 1px solid currentColor;
      border-right: 1px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }
    a:hover .arrow, a:focus-visible .arrow { transform: translateX(.28rem); }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
    @media (max-width: 32rem) {
      main { width: auto; padding-inline: 1.5rem; }
      h1 { font-size: clamp(1.5rem, .2rem + 7vw, 2.25rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow { transition: none; }
    }
  </style>
<link rel="stylesheet" href="theme/common.css?v=3"><link rel="stylesheet" href="theme/cover.css?v=5">
</head>
<body>
  <main>
    <img class="cover" src="ortopia-cover.jpg?v=0eb1e1f9" width="1448" height="1086" fetchpriority="high" alt="A laurel-crowned robot looks across the sea toward a city beneath an optimization landscape, with ORTOPIA beneath the oval.">
    <h1>A Utopia for <em>AI-Native</em><br> Operations Research</h1>
    <nav aria-label="ORtopia">
      <a href="dataset/">Dataset<span class="arrow" aria-hidden="true"></span></a>
      <a href="simulation/">Simulation<span class="arrow" aria-hidden="true"></span></a>
    </nav>
  </main>
</body>
</html>
