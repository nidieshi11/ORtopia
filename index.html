<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5ee">
  <title>ORtopia</title>
  <script>
    // Older links used the fragment to select a simulation or a catalog view.
    if (/^#(?:(?:\/problem\/)?P\d{4}(?:\/[1-9]\d*)?|scene\/.+|remaining|world20|lab20)$/.test(location.hash)) {
      location.replace('simulation/' + location.search + location.hash);
    } else if (/^#\/(?:domains|library|domain\/[^/]+(?:\/[^/]+)?|case\/P\d{4})$/.test(location.hash)) {
      location.replace('benchmark/' + location.search + location.hash);
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      background: #f6f5ee;
      color: #163d34;
      font-family: "Inter", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 90% 10%, #e8eddf 0%, transparent 55%),
                  #f6f5ee;
    }
    main {
      display: grid;
      align-content: center;
      width: min(80%, 64rem);
      min-height: 100vh;
      min-height: 100svh;
      margin-inline: auto;
      padding-block: clamp(3rem, 10vh, 8rem);
    }
    h1 {
      max-width: 29ch;
      margin: 0;
      font: 400 clamp(2rem, 1.45rem + 2.7vw, 4rem)/1.12 "Baskervville", Georgia, serif;
      letter-spacing: -.035em;
      text-wrap: balance;
    }
    .name {
      font-family: "Inter", "Segoe UI", sans-serif;
      font-size: .85em;
      font-weight: 650;
      letter-spacing: -.065em;
    }
    h1 em { font-weight: 400; white-space: nowrap; }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem clamp(1.25rem, 4vw, 3rem);
      margin-top: clamp(1.5rem, 3.5vh, 2.5rem);
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-self: start;
      gap: 1.25rem;
      min-height: 44px;
      padding: .5rem 0;
      border-bottom: 1px solid currentColor;
      color: inherit;
      font-size: 1.125rem;
      font-weight: 600;
      text-decoration: none;
    }
    .arrow {
      position: relative;
      width: 1.5rem;
      height: 1px;
      background: currentColor;
      transition: transform .18s ease-out;
    }
    .arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: .49rem;
      height: .49rem;
      border-top: 1px solid currentColor;
      border-right: 1px solid currentColor;
      transform: translateY(-50%) rotate(45deg);
    }
    a:hover .arrow, a:focus-visible .arrow { transform: translateX(.28rem); }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
    @media (max-width: 32rem) {
      main { width: auto; padding-inline: 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1><span class="name">ORtopia：</span>An utopia for <em>AI-native</em> Operation Research</h1>
    <nav aria-label="ORtopia">
      <a href="benchmark/">Benchmark<span class="arrow" aria-hidden="true"></span></a>
      <a href="simulation/">Simulation<span class="arrow" aria-hidden="true"></span></a>
    </nav>
  </main>
</body>
</html>
